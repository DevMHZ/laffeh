document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

yle }}\">\n          <div style=\"font-size:26px; line-height:1;\">{{ it.icon }}<\u002Fdiv>\n          <div style=\"font-weight:800; font-size:12.5px; margin-top:6px;\">{{ it.label }}<\u002Fdiv>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; gap:10px; margin-top:2px;\">\n      <button onclick=\"{{ exportCurrent }}\" style=\"border:0; cursor:pointer; font-family:inherit; font-weight:800; font-size:13px; color:#fff; background:#149b8e; padding:12px 20px; border-radius:13px; box-shadow:0 6px 16px rgba(20,155,142,.35);\">↓ Download .glb<\u002Fbutton>\n      <button onclick=\"{{ exportGltf }}\" style=\"border:0; cursor:pointer; font-family:inherit; font-weight:800; font-size:13px; color:#3a4a44; background:rgba(255,255,255,.85); padding:12px 20px; border-radius:13px; box-shadow:0 3px 10px rgba(30,42,46,.08);\">↓ .gltf (JSON)<\u002Fbutton>\n      <button onclick=\"{{ exportAll }}\" style=\"border:0; cursor:pointer; font-family:inherit; font-weight:800; font-size:13px; color:#3a4a44; background:rgba(255,255,255,.85); padding:12px 20px; border-radius:13px; box-shadow:0 3px 10px rgba(30,42,46,.08);\">↓ All 4 .glb<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { ready: false, current: 'bus' };\n\n  renderVals() {\n    const A = window.LaffaAvatars;\n    const order = A ? A.order : ['bus','taxi','vespa','camel'];\n    const icons = { bus:'🚐', taxi:'🚕', vespa:'🛵', camel:'🐪' };\n    const metaFor = (id) => (A ? A.meta[id] : { label:id, tag:'', tri:'' });\n    const cur = metaFor(this.state.current);\n    const items = order.map((id) => {\n      const m = metaFor(id);\n      const active = id === this.state.current;\n      return {\n        id, label: m.label, icon: icons[id],\n        onClick: () => this.select(id),\n        style: `border:0;cursor:pointer;font-family:inherit;width:96px;padding:14px 8px;border-radius:16px;`\n          + `background:${active ? '#ffffff' : 'rgba(255,255,255,.55)'};`\n          + `color:${active ? '#1f2a2e' : '#5c6a63'};`\n          + `box-shadow:${active ? '0 8px 22px rgba(30,42,46,.16), inset 0 0 0 2px #149b8e' : '0 3px 10px rgba(30,42,46,.06)'};`\n          + `transform:${active ? 'translateY(-4px)' : 'none'};transition:all .22s cubic-bezier(.2,.8,.2,1);`,\n      };\n    });\n    return {\n      mountRef: this._mountRef || (this._mountRef = (el) => { this._mount = el; this._tryStart(); }),\n      loaderRef: this._loaderRef || (this._loaderRef = (el) => { this._loader = el; }),\n      items,\n      current: { label: cur.label, tag: cur.tag, tri: cur.tri },\n      toggleRotate: () => { if (this._controls) this._controls.autoRotate = !this._controls.autoRotate; },\n      resetView: () => this._resetView(),\n      exportCurrent: () => this._download(false),\n      exportGltf: () => this._download(true),\n      exportAll: () => this._downloadAll(),\n    };\n  }\n\n  select(id) {\n    if (id === this.state.current && this._current) return;\n    this.setState({ current: id });\n    this._loadAvatar(id);\n  }\n\n  _tryStart() {\n    if (this._started) return;\n    const go = () => {\n      if (window.THREE && window.__ADDONS && window.LaffaAvatars && this._mount) {\n        this._started = true;\n        this._init();\n      } else {\n        setTimeout(go, 60);\n      }\n    };\n    window.addEventListener('three-ready', go);\n    go();\n  }\n\n  _init() {\n    const THREE = window.THREE;\n    const { OrbitControls, RoundedBoxGeometry, GLTFExporter, RoomEnvironment } = window.__ADDONS;\n    window.LaffaAvatars.init(THREE, { RoundedBoxGeometry });\n    this._GLTFExporter = GLTFExporter;\n    if (this._loader) this._loader.style.display = 'none';\n\n    const el = this._mount;\n    while (el.firstChild) el.removeChild(el.firstChild); // drop any stale canvas from a prior mount\n    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });\n    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));\n    renderer.shadowMap.enabled = true;\n    renderer.shadowMap.type = THREE.PCFSoftShadowMap;\n    renderer.toneMapping = THREE.ACESFilmicToneMapping;\n    renderer.toneMappingExposure = 1.05;\n    renderer.outputColorSpace = THREE.SRGBColorSpace;\n    el.appendChild(renderer.domElement);\n    this._renderer = renderer;\n\n    const scene = new THREE.Scene();\n    this._scene = scene;\n    window.__laffaScene = scene; window.__laffaComp = this;\n    const pmrem = new THREE.PMREMGenerator(renderer);\n    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;\n\n    const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);\n    this._camera = camera;\n\n    const controls = new OrbitControls(camera, renderer.domElement);\n    controls.enableDamping = true;\n    controls.dampingFactor = 0.08;\n    controls.autoRotate = true;\n    controls.autoRotateSpeed = 1.1;\n    controls.minDistance = 2;\n    controls.maxDistance = 16;\n    controls.maxPolarAngle = Math.PI * 0.49;\n    controls.enablePan = false;\n    this._controls = controls;\n\n    // lights\n    const hemi = new THREE.HemisphereLight(0xffffff, 0xd9e2d4, 0.85);\n    scene.add(hemi);\n    const key = new THREE.DirectionalLight(0xfff4e2, 2.1);\n    key.position.set(5, 8, 4);\n    key.castShadow = true;\n    key.shadow.mapSize.set(2048, 2048);\n    key.shadow.camera.near = 1; key.shadow.camera.far = 30;\n    const d = 8; Object.assign(key.shadow.camera, { left:-d, right:d, top:d, bottom:-d });\n    key.shadow.bias = -0.0004;\n    key.shadow.radius = 6;\n    scene.add(key);\n    const fill = new THREE.DirectionalLight(0xcfe0ff, 0.5);\n    fill.position.set(-6, 4, -3);\n    scene.add(fill);\n\n    this._buildMap();\n\n    this._avatarHolder = new THREE.Group();\n    scene.add(this._avatarHolder);\n    this._clock = new THREE.Clock();\n    this._loadAvatar(this.state.current);\n\n    const resize = () => {\n      const w = el.clientWidth, h = el.clientHeight;\n      if (!w || !h) return;\n      renderer.setSize(w, h, true);\n      camera.aspect = w / h; camera.updateProjectionMatrix();\n    };\n    this._ro = new ResizeObserver(resize); this._ro.observe(el);\n    resize();\n\n    const loop = () => {\n      if (window.__laffaComp !== this) { this._raf = null; return; } // orphaned instance: stop\n      this._raf = requestAnimationFrame(loop);\n      const dt = this._clock.getDelta();\n      if (this._pop) {\n        const k = Math.min(1, (this._clock.getElapsedTime() - this._pop.t0) / 0.42);\n        const e = 1 - Math.pow(1 - k, 3);\n        this._pop.group.scale.setScalar(0.5 + e * 0.5);\n        if (k >= 1) { this._pop.group.scale.setScalar(1); this._pop = null; }\n      }\n      if (this._mixer) this._mixer.update(dt);\n      controls.update();\n      renderer.render(scene, camera);\n    };\n    loop();\n  }\n\n  _resetView() {\n    if (!this._camera || !this._current) return;\n    this._frameAvatar(this._current);\n  }\n\n  // Fit the camera to the model's bounding box so it reads centered and\n  // complete, regardless of each avatar's height/width (bus/camel are tall,\n  // vespa/taxi are low) — keeps the same 3/4 viewing angle for all.\n  _frameAvatar(group) {\n    const THREE = window.THREE;\n    const box = new THREE.Box3().setFromObject(group);\n    const size = new THREE.Vector3(); box.getSize(size);\n    const center = new THREE.Vector3(); box.getCenter(center);\n    const dir = new THREE.Vector3(0.62, 0.5, 0.72).normalize();\n    const target = new THREE.Vector3(center.x, box.min.y + size.y * 0.34, center.z);\n\n    // Build a camera-facing basis for this dir, then project all 8 box\n    // corners onto (right, up) to find the true on-screen extent — robust\n    // for elongated/oblique shapes where a single bounding-sphere radius\n    // under- or over-estimates depending on proportions.\n    const worldUp = new THREE.Vector3(0, 1, 0);\n    const right = new THREE.Vector3().crossVectors(dir, worldUp).normalize();\n    const up = new THREE.Vector3().crossVectors(right, dir).normalize();\n    let maxRight = 0, maxUp = 0;\n    const corners = [\n      [box.min.x, box.min.y, box.min.z], [box.max.x, box.min.y, box.min.z],\n      [box.min.x, box.max.y, box.min.z], [box.max.x, box.max.y, box.min.z],\n      [box.min.x, box.min.y, box.max.z], [box.max.x, box.min.y, box.max.z],\n      [box.min.x, box.max.y, box.max.z], [box.max.x, box.max.y, box.max.z],\n    ];\n    const v = new THREE.Vector3();\n    for (const c of corners) {\n      v.set(c[0], c[1], c[2]).sub(target);\n      maxRight = Math.max(maxRight, Math.abs(v.dot(right)));\n      maxUp = Math.max(maxUp, Math.abs(v.dot(up)));\n    }\n    const fov = this._camera.fov * (Math.PI / 180);\n    const aspect = this._camera.aspect || 1.71;\n    const margin = 1.7; // headroom so the model never touches the label/button chrome\n    const distForUp = (maxUp * margin) / Math.tan(fov / 2);\n    const distForRight = (maxRight * margin) / (Math.tan(fov / 2) * aspect);\n    const dist = Math.max(distForUp, distForRight);\n\n    this._camera.position.copy(target).addScaledVector(dir, dist);\n    this._controls.target.copy(target);\n    this._controls.minDistance = dist * 0.4;\n    this._controls.maxDistance = dist * 2.6;\n    this._controls.update();\n  }\n\n  _buildMap() {\n    const THREE = window.THREE;\n    const g = new THREE.Group();\n    // ground\n    const groundMat = new THREE.MeshStandardMaterial({ color: 0xeef2ea, roughness: 0.95 });\n    const ground = new THREE.Mesh(new THREE.CircleGeometry(16, 64), groundMat);\n    ground.rotation.x = -Math.PI / 2; ground.position.y = -0.001; ground.receiveShadow = true;\n    g.add(ground);\n    // roads (cross under avatar)\n    const roadMat = new THREE.MeshStandardMaterial({ color: 0xe2e7de, roughness: 1 });\n    const rNS = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 32), roadMat);\n    rNS.rotation.x = -Math.PI / 2; rNS.position.y = 0.002; rNS.receiveShadow = true;\n    const rEW = new THREE.Mesh(new THREE.PlaneGeometry(32, 2.4), roadMat);\n    rEW.rotation.x = -Math.PI / 2; rEW.position.y = 0.002; rEW.receiveShadow = true;\n    g.add(rNS, rEW);\n    // lane dashes\n    const dashMat = new THREE.MeshStandardMaterial({ color: 0xf6b23c, roughness: 0.8 });\n    for (let i = -7; i <= 7; i++) {\n      if (Math.abs(i) < 1) continue;\n      const d1 = new THREE.Mesh(new THREE.PlaneGeometry(0.12, 0.8), dashMat);\n      d1.rotation.x = -Math.PI / 2; d1.position.set(0, 0.004, i * 2); g.add(d1);\n      const d2 = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.12), dashMat);\n      d2.rotation.x = -Math.PI / 2; d2.position.set(i * 2, 0.004, 0); g.add(d2);\n    }\n    // river band\n    const river = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 32), new THREE.MeshStandardMaterial({ color: 0xbfe0ea, roughness: 0.4 }));\n    river.rotation.x = -Math.PI / 2; river.position.set(-9, 0.0015, 0); river.rotation.z = 0.3; g.add(river);\n    // pastel city blocks + a couple of low buildings for Monument-Valley depth\n    const blockCols = [0xd8e6cf, 0xe7ded0, 0xdfe7ef, 0xe9dfe6];\n    const bColmat = blockCols.map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.9 }));\n    const RB = window.__ADDONS.RoundedBoxGeometry;\n    let idx = 0;\n    for (let x = -3; x <= 3; x += 2) {\n      for (let z = -3; z <= 3; z += 2) {\n        if (Math.abs(x) < 1.4 || Math.abs(z) < 1.4) continue; // keep roads clear\n        const h = 0.3 + ((idx * 37) % 5) * 0.28;\n        const b = new THREE.Mesh(new RB(1.3, h, 1.3, 3, 0.14), bColmat[idx % 4]);\n        b.position.set(x * 1.35, h / 2, z * 1.35);\n        b.castShadow = true; b.receiveShadow = true;\n        // little roof\n        const roof = new THREE.Mesh(new THREE.SphereGeometry(0.5, 12, 8, 0, Math.PI*2, 0, Math.PI/2), new THREE.MeshStandardMaterial({ color: 0xcbb79c, roughness: 0.9 }));\n        roof.scale.set(1.3, 0.5, 1.3); roof.position.set(x * 1.35, h, z * 1.35);\n        g.add(b, roof);\n        idx++;\n      }\n    }\n    // a few soft trees\n    for (const [tx, tz] of [[-2.6, 3.2],[3.4,-2.4],[2.8,3.4],[-3.4,-3.2]]) {\n      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.1,0.4,10), new THREE.MeshStandardMaterial({color:0xb08d63,roughness:1}));\n      trunk.position.set(tx,0.2,tz); trunk.castShadow=true;\n      const crown = new THREE.Mesh(new THREE.SphereGeometry(0.42,16,14), new THREE.MeshStandardMaterial({color:0x8fc08a,roughness:1}));\n      crown.position.set(tx,0.7,tz); crown.scale.set(1,1.1,1); crown.castShadow=true;\n      g.add(trunk,crown);\n    }\n    this._scene.add(g);\n  }\n\n  _loadAvatar(id) {\n    if (!this._avatarHolder) return;\n    // clear\n    while (this._avatarHolder.children.length) this._avatarHolder.remove(this._avatarHolder.children[0]);\n    if (this._mixer) { this._mixer.stopAllAction(); this._mixer = null; }\n    const { group, clips } = window.LaffaAvatars.build(id);\n    this._current = group;\n    this._avatarHolder.add(group);\n    // measure + frame BEFORE scaling down for the pop-in, so the box\n    // reflects the model's true size (not the mid-animation scale)\n    if (this._camera) this._frameAvatar(group);\n    // play idle clip\n    const THREE = window.THREE;\n    if (clips && clips[0]) {\n      this._mixer = new THREE.AnimationMixer(group);\n      const act = this._mixer.clipAction(clips[0]);\n      act.play();\n    }\n    // pop-in scale — driven by the main render loop (rAF-throttle safe)\n    group.scale.setScalar(0.5);\n    this._pop = { group, t0: (this._clock ? this._clock.getElapsedTime() : 0) };\n  }\n\n  async _exportBlob(id, binary) {\n    const THREE = window.THREE;\n    const { group, clips } = window.LaffaAvatars.build(id);\n    // strip the baked contact-shadow sprite from the exported model\n    const drop = [];\n    group.traverse((o) => { if (o.name === 'contactShadow') drop.push(o); });\n    drop.forEach((o) => o.parent && o.parent.remove(o));\n    const exporter = new this._GLTFExporter();\n    return new Promise((resolve, reject) => {\n      exporter.parse(group, (result) => {\n        if (binary) resolve(new Blob([result], { type: 'model/gltf-binary' }));\n        else resolve(new Blob([JSON.stringify(result)], { type: 'model/gltf+json' }));\n      }, reject, { binary, animations: clips || [], embedImages: true });\n    });\n  }\n\n  async _downloadAll() {\n    for (const id of window.LaffaAvatars.order) {\n      const blob = await this._exportBlob(id, true);\n      const meta = window.LaffaAvatars.meta[id];\n      const a = document.createElement('a');\n      a.href = URL.createObjectURL(blob);\n      a.download = meta.file + '.glb';\n      a.click();\n      await new Promise(r => setTimeout(r, 400));\n      URL.revokeObjectURL(a.href);\n    }\n  }\n\n  async _download(asGltf) {\n    const id = this.state.current;\n    const blob = await this._exportBlob(id, !asGltf);\n    const meta = window.LaffaAvatars.meta[id];\n    const a = document.createElement('a');\n    a.href = URL.createObjectURL(blob);\n    a.download = meta.file + (asGltf ? '.gltf' : '.glb');\n    a.click();\n    setTimeout(() => URL.revokeObjectURL(a.href), 2000);\n  }\n\n  // exposed for tooling: returns base64 GLB for a given id\n  componentDidMount() {\n    window.__laffaExport = async (id) => {\n      const blob = await this._exportBlob(id, true);\n      const buf = await blob.arrayBuffer();\n      let bin = ''; const bytes = new Uint8Array(buf);\n      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);\n      return { b64: btoa(bin), bytes: bytes.length };\n    };\n  }\n\n  componentWillUnmount() {\n    if (this._raf) cancelAnimationFrame(this._raf);\n    if (this._ro) this._ro.disconnect();\n    if (this._renderer) this._renderer.dispose();\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
