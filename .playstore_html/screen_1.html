<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1242px;
      height: 2208px;
      font-family: 'Almarai', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, #083D24 0%, #02160C 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 130px;
      position: relative;
      overflow: hidden;
    }
    .glow {
      position: absolute;
      top: 55%;
      left: 50%;
      transform: translate(-50%, -40%);
      width: 1100px;
      height: 1100px;
      background: radial-gradient(circle, rgba(16,185,129,0.3) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
    }
    .header {
      text-align: center;
      z-index: 10;
      padding: 0 40px;
    }
    .title {
      font-size: 62px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 20px;
      line-height: 1.25;
      text-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .subtitle {
      font-size: 38px;
      font-weight: 700;
      color: #a7f3d0;
      line-height: 1.4;
      text-shadow: 0 2px 10px rgba(0,0,0,0.4);
    }
    .phone-container {
      margin-top: 90px;
      z-index: 10;
      position: relative;
    }
    .phone-shadow {
      position: absolute;
      bottom: -50px;
      left: 50%;
      transform: translateX(-50%);
      width: 820px;
      height: 100px;
      background: rgba(0,0,0,0.7);
      filter: blur(45px);
      border-radius: 50%;
    }
    .phone-frame {
      width: 880px;
      background: #1e293b;
      border: 20px solid #334155;
      border-radius: 60px;
      box-shadow: 0 40px 90px rgba(0,0,0,0.8), inset 0 0 0 3px rgba(255,255,255,0.15);
      position: relative;
      overflow: hidden;
    }
    .user-img {
      width: 100%;
      display: block;
      border-radius: 40px;
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="header">
    <h1 class="title">تخطيط أذكى مسار متعدد النقاط</h1>
    <p class="subtitle">ترتيب تلقائي يُوفّر وقتك ووقودك بضغطة زر</p>
  </div>
  <div class="phone-container">
    <div class="phone-shadow"></div>
    <div class="phone-frame">
      <img class="user-img" src="file:///Users/mohamadalzoubi/.gemini/antigravity/brain/c906cada-87e6-469e-b46a-d56d71f770f1/.user_uploaded/media__1785001652511.jpg" />
    </div>
  </div>
</body>
</html>
